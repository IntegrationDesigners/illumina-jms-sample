# ── illumina-jms-tls Secret ─────────────────────────────────────────────────
# Do NOT apply this file directly — it contains placeholders.
# Create the secret with the oc command below instead:
#
#   oc create secret generic illumina-jms-tls \
#     --from-file=keystore.jks=/path/to/keystore.jks \
#     --from-file=truststore.jks=/path/to/truststore.jks \
#     --from-file=ccdt.json=/path/to/ccdt.json \
#     --from-literal=keystore-password=<YOUR_PASSWORD> \
#     --from-literal=truststore-password=<YOUR_PASSWORD> \
#     -n illumina-jms
#
# To update an existing secret:
#   oc create secret generic illumina-jms-tls --dry-run=client -o yaml \
#     --from-file=keystore.jks=... (same args) | oc apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: illumina-jms-tls
  namespace: illumina-jms
  labels:
    app.kubernetes.io/part-of: illumina-jms
type: Opaque
data:
  keystore.jks: <BASE64_ENCODED_KEYSTORE>
  truststore.jks: <BASE64_ENCODED_TRUSTSTORE>
  ccdt.json: <BASE64_ENCODED_CCDT_JSON>
  keystore-password: <BASE64_ENCODED_PASSWORD>
  truststore-password: <BASE64_ENCODED_PASSWORD>
