# ── jms-config Secret ────────────────────────────────────────────────────────
# Run the command below to generate the secret YAML from your local files.
# Copy the output yaml to the OpenShift machine and apply it there.
#
# Generate secret yaml (run this on your local machine):
#
#   oc create secret generic jms-config \
#     --from-file=keystore.jks=/path/to/keystore.jks \
#     --from-file=truststore.jks=/path/to/truststore.jks \
#     --from-file=ccdt.json=/path/to/ccdt.json \
#     --from-literal=keystore-password=<YOUR_PASSWORD> \
#     --from-literal=truststore-password=<YOUR_PASSWORD> \
#     --dry-run=client -o yaml > jms-config-secret.yaml
#
# Then copy jms-config-secret.yaml to the OpenShift machine and apply:
#
#   oc apply -f jms-config-secret.yaml
#
# To update an existing secret (same command, just re-run):
#   oc apply -f jms-config-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: jms-config
  labels:
    app.kubernetes.io/part-of: illumina-jms
type: Opaque
data:
  keystore.jks: <BASE64_ENCODED_KEYSTORE>
  truststore.jks: <BASE64_ENCODED_TRUSTSTORE>
  ccdt.json: <BASE64_ENCODED_CCDT_JSON>
  keystore-password: <BASE64_ENCODED_PASSWORD>
  truststore-password: <BASE64_ENCODED_PASSWORD>
